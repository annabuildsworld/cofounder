name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # config.js is built from the FORMSPREE_ENDPOINT repo secret so the link never lives in the repo
      - name: Build site with config.js
        env:
          FORMSPREE_ENDPOINT: ${{ secrets.FORMSPREE_ENDPOINT }}
        run: |
          if [ -z "$FORMSPREE_ENDPOINT" ]; then
            echo "::error::Add a repository secret named FORMSPREE_ENDPOINT (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          mkdir site
          cp index.html site/
          printf 'window.FORMSPREE_ENDPOINT = "%s";\n' "$FORMSPREE_ENDPOINT" > site/config.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
